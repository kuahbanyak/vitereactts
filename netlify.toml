[build]
  command = "pnpm install --no-frozen-lockfile && pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Empty string to use relative URLs - Netlify proxy will forward /api/v1/* to backend
  VITE_API_BASE_URL = ""

# API proxy for backend calls (if VITE_API_BASE_URL is not set)
[[redirects]]
  from = "/api/v1/*"
  to = "https://go-crud.up.railway.app/api/v1/:splat"
  status = 200
  force = true

# SPA fallback - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200